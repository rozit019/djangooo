{% extends 'base.html' %} {% block content %}

<style>
  body {
    margin: 0;
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
  }

  @keyframes gradientBG {
    0% {
      background-position: 0% 50%;
    }
    50% {
      background-position: 100% 50%;
    }
    100% {
      background-position: 0% 50%;
    }
  }

  .chat-container {
    max-width: 700px;
    margin: 60px auto;
    padding: 30px;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(12px);
    border-radius: 20px;
    color: white;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
    animation: fadeIn 0.8s ease;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: scale(0.95);
    }
    to {
      opacity: 1;
      transform: scale(1);
    }
  }

  #chat-box {
    background: rgba(255, 255, 255, 0.2);
    color: black;
    height: 300px;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    border-radius: 12px;
    margin-bottom: 20px;
  }

  input[type="text"] {
    flex-grow: 1;
    padding: 10px;
    border: none;
    border-radius: 8px 0 0 8px;
    background-color: rgba(255, 255, 255, 0.9);
    color: black;
  }

  button[type="submit"] {
    background-color: #e73c7e;
    color: white;
    padding: 10px 20px;
    border: none;
    border-radius: 0 8px 8px 0;
    font-weight: bold;
    transition: 0.3s;
  }

  button[type="submit"]:hover {
    background-color: #d12a6a;
  }

  .go-back-btn {
    background-color: #23d5ab;
    color: white;
    font-weight: bold;
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    margin-top: 15px;
    transition: 0.3s;
  }

  .go-back-btn:hover {
    background-color: #1ebd97;
  }
</style>

<div class="chat-container">
  <h2 class="text-3xl font-bold mb-6 text-center text-white">🤖 Chatbot</h2>

  <div id="chat-box">
    <p><strong>Bot:</strong> Hello!</p>
    <p><strong>You:</strong> Hi!</p>
  </div>

  <form id="chat-form" class="flex">
    <input
      type="text"
      id="user-message"
      placeholder="Type a message..."
      autocomplete="off"
      required
    />
    <button type="submit">Send</button>
  </form>

  <button class="go-back-btn" onclick="window.history.back()">← Go Back</button>
</div>

<script>
  document
    .getElementById("chat-form")
    .addEventListener("submit", async function (e) {
      e.preventDefault();

      const input = document.getElementById("user-message");
      const message = input.value.trim();
      if (!message) return;

      const chatBox = document.getElementById("chat-box");

      const userMsgDiv = document.createElement("div");
      userMsgDiv.style.backgroundColor = "#bbf7d0";
      userMsgDiv.style.color = "black";
      userMsgDiv.style.borderRadius = "8px";
      userMsgDiv.style.padding = "8px 12px";
      userMsgDiv.style.maxWidth = "80%";
      userMsgDiv.style.alignSelf = "flex-end";
      userMsgDiv.style.textAlign = "right";
      userMsgDiv.textContent = `You: ${message}`;
      chatBox.appendChild(userMsgDiv);

      chatBox.scrollTop = chatBox.scrollHeight;
      input.value = "";

      try {
        const response = await fetch("{% url 'chatbot_api' %}", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRFToken": getCookie("csrftoken"),
          },
          body: JSON.stringify({ message }),
        });

        if (!response.ok) throw new Error("Network response not OK");

        const data = await response.json();

        const botMsgDiv = document.createElement("div");
        botMsgDiv.style.backgroundColor = "#bfdbfe";
        botMsgDiv.style.color = "black";
        botMsgDiv.style.borderRadius = "8px";
        botMsgDiv.style.padding = "8px 12px";
        botMsgDiv.style.maxWidth = "80%";
        botMsgDiv.style.alignSelf = "flex-start";
        botMsgDiv.style.textAlign = "left";
        botMsgDiv.textContent = `Bot: ${data.reply || "No response."}`;
        chatBox.appendChild(botMsgDiv);

        chatBox.scrollTop = chatBox.scrollHeight;
      } catch (error) {
        console.error("Error fetching bot reply:", error);
      }
    });

  function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== "") {
      const cookies = document.cookie.split(";");
      for (let cookie of cookies) {
        cookie = cookie.trim();
        if (cookie.startsWith(name + "=")) {
          cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
          break;
        }
      }
    }
    return cookieValue;
  }
</script>

{% endblock %}

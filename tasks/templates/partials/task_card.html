<div
  class="list-group-item d-flex justify-content-between align-items-start"
  id="task-{{ task.id }}"
>
  <div>
    <input
      class="form-check-input"
      type="checkbox"
      id="taskCheckbox{{ task.id }}"
      onclick="markCompleted({{ task.id }}, this)"
      {%
      if
      task.completed
      %}checked{%
      endif
      %}
    />

    <label
      class="form-check-label {% if task.completed %}text-decoration-line-through text-success{% endif %}"
      for="taskCheckbox{{ task.id }}"
      style="margin-left: 10px; display: inline-block"
    >
      <span>
        <span style="text-decoration: underline">
          <strong>{{ task.title }}</strong>
        </span>
        <span class="badge bg-secondary ms-2">{{ task.priority }}</span><br />
        <small>{{ task.description }} | Due: {{ task.due_date }}</small>
      </span>
    </label>

    <!-- Move clickable title OUTSIDE label -->
    <div style="margin-top: 2px; margin-left: 32px">
      <a
        href="{% url 'task_detail' task.id %}"
        style="text-decoration: underline"
      >
        View Details
      </a>
    </div>
  </div>

  <form
    method="POST"
    action="{% url 'delete_task' task.id %}"
    onsubmit="return confirm('Are you sure you want to delete this task?');"
  >
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
  </form>
</div>

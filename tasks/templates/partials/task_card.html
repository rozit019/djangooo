<div
  class="list-group-item d-flex justify-content-between align-items-start"
  id="task-{{ task.id }}"
>
  <div class="form-check">
    <input
      class="form-check-input"
      type="checkbox"
      id="taskCheckbox{{ task.id }}"
      {%
      if
      task.completed
      %}checked{%
      endif
      %}
      onclick="markCompleted({{ task.id }}, this)"
    />
    <label
      class="form-check-label {% if task.completed %}text-decoration-line-through text-success{% endif %}"
      for="taskCheckbox{{ task.id }}"
    >
      <strong>{{ task.title }}</strong>
      <span class="badge bg-secondary">{{ task.priority }}</span><br />
      <small>{{ task.description }} | Due: {{ task.due_date }}</small>
    </label>
  </div>

  <form method="POST" action="{% url 'delete_task' task.id %}">
    {% csrf_token %}
    <button type="submit" class="btn btn-sm btn-danger">Delete</button>
  </form>
</div>
